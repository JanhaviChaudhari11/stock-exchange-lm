<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Exchange Language Model</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Stock Exchange Language Model</h1>
    <p class="sub">A GPT-style transformer trained from scratch on financial text.
      Demo only — not investment advice.</p>
    <div id="model-info" class="chips"></div>
  </header>

  <main>
    <section class="card">
      <h2>Generate</h2>
      <textarea id="prompt" rows="2">Operating profit rose</textarea>
      <div class="examples">
        <button class="chip-btn">Shares of the company</button>
        <button class="chip-btn">The central bank</button>
        <button class="chip-btn">Net sales decreased</button>
      </div>
      <div class="controls">
        <label>Temperature <span id="temperature-val">0.8</span>
          <input id="temperature" type="range" min="0.1" max="2" step="0.1" value="0.8"></label>
        <label>Top-k <span id="top_k-val">40</span>
          <input id="top_k" type="range" min="0" max="200" step="5" value="40"></label>
        <label>Top-p <span id="top_p-val">0.95</span>
          <input id="top_p" type="range" min="0.1" max="1" step="0.05" value="0.95"></label>
        <label>Max tokens <span id="max_tokens-val">120</span>
          <input id="max_tokens" type="range" min="10" max="400" step="10" value="120"></label>
      </div>
      <button id="go" class="primary">Generate</button>
      <div id="output" class="output"></div>
      <div id="stats" class="stats"></div>
    </section>

    <section class="card">
      <h2>Training performance <span id="train-status" class="badge"></span></h2>
      <p class="sub">Updates automatically while <code>train.py</code> is running.</p>
      <div class="charts">
        <div><canvas id="lossChart"></canvas></div>
        <div><canvas id="pplChart"></canvas></div>
        <div><canvas id="accChart"></canvas></div>
        <div><canvas id="lrChart"></canvas></div>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
